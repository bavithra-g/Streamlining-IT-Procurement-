<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Procurement</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Streamlining IT Procurement</h1>
        <p>Automating Standard Laptop Orders</p>
    </header>

    <main>

        <section class="order-container">

            <h2>Standard Laptop Order</h2>

            <form id="orderForm">

                <label for="employeeName">Employee Name</label>
                <input
                    type="text"
                    id="employeeName"
                    placeholder="Enter employee name"
                    required
                >

                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Operations">Operations</option>
                </select>

                <label for="laptop">Laptop Model</label>
                <select id="laptop" required>
                    <option value="">Select Laptop</option>
                    <option value="Dell Latitude">Dell Latitude</option>
                    <option value="HP ProBook">HP ProBook</option>
                    <option value="Lenovo ThinkPad">Lenovo ThinkPad</option>
                </select>

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    min="1"
                    value="1"
                    required
                >

                <button type="submit">Place Order</button>

            </form>

        </section>


        <section id="orderResult" class="result">
            <h2>Order Summary</h2>
            <p id="summary"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 IT Procurement System</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
